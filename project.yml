name: MergeAndMunch
options:
  bundleIdPrefix: com.mergeandmunch
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  MergeAndMunch:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/MergeAndMunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mergeandmunch.market
        INFOPLIST_KEY_CFBundleDisplayName: Merge & Munch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: false
      testTargets: []
